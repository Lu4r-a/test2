<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chicken Proxy | Final Pro Fix</title>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 12px 20px; background: #1e1e1e; display: flex; gap: 10px; align-items: center; border-bottom: 2px solid #ffcc00; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; font-size: 16px; outline: none; }
        .btn { background: #ffcc00; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #iframe-container { flex: 1; width: 100%; background: white; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <button class="btn" onclick="location.href='index.html'">Back</button>
        <input type="text" id="url-input" placeholder="Search Google or enter a URL (e.g. youtube.com)">
        <button class="btn" onclick="launch()">Launch</button>
    </header>

    <div id="iframe-container">
        <iframe id="proxy-frame" src="about:blank"></iframe>
    </div>

    <script>
        const WORKER_URL = "https://chicken-proxy.chickenmonkey278.workers.dev"; 

        function launch() {
            let val = document.getElementById('url-input').value.trim();
            if (!val) return;

            let target;
            // Decide if we are searching or navigating
            if (!val.includes('.') || val.includes(' ')) {
                target = 'https://www.google.com/search?q=' + encodeURIComponent(val);
            } else {
                target = val.startsWith('http') ? val : 'https://' + val;
            }

            // Encode the URL into Base64 so it travels safely to the Worker
            const encodedUrl = btoa(target);
            document.getElementById('proxy-frame').src = `${WORKER_URL}/${encodedUrl}`;
        }

        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launch();
        });
    </script>
</body>
</html>

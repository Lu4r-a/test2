<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Proxy</title>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 10px 20px; background: #1e1e1e; display: flex; gap: 10px; align-items: center; border-bottom: 2px solid #ffcc00; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; outline: none; }
        .btn { background: #ffcc00; color: black; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        #iframe-container { flex: 1; width: 100%; background: white; }
        iframe { width: 100%; height: 100%; border: none; }
        .info { background: #111; font-size: 10px; padding: 5px; text-align: center; color: #666; }
    </style>
</head>
<body>

    <header>
        <button class="btn" onclick="location.href='index.html'">Back</button>
        <input type="text" id="url-input" placeholder="Enter URL or Search Query...">
        <button class="btn" onclick="launch()">Launch</button>
    </header>

    <div id="iframe-container">
        <iframe id="proxy-frame" src="about:blank"></iframe>
    </div>

    <div class="info">
        Tip: If searching INSIDE a site fails, type your search directly into the yellow bar above.
    </div>

    <script>
        const WORKER_URL = "https://chicken-proxy.chickenmonkey278.workers.dev"; 

        function launch() {
            let val = document.getElementById('url-input').value.trim();
            if (!val) return;

            let target;
            // 1. If it's not a URL, use DuckDuckGo (it's much easier to proxy than Google)
            if (!val.includes('.') || val.includes(' ')) {
                target = 'https://duckduckgo.com/?q=' + encodeURIComponent(val);
            } else {
                target = val.startsWith('http') ? val : 'https://' + val;
            }

            const frame = document.getElementById('proxy-frame');
            
            // 2. We use a simpler Base64 path that Cloudflare can easily parse
            try {
                const encoded = btoa(target);
                frame.src = `${WORKER_URL}/${encoded}`;
            } catch(e) {
                // Fallback if URL contains weird characters
                frame.src = `${WORKER_URL}/?url=${encodeURIComponent(target)}`;
            }
        }

        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launch();
        });
    </script>
</body>
</html>

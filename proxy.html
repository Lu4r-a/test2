<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Proxy</title>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px 25px; background: #1e1e1e; display: flex; gap: 15px; align-items: center; border-bottom: 2px solid #ffcc00; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #333; color: white; font-size: 16px; outline: none; }
        .btn { background: #ffcc00; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; }
        #iframe-container { flex: 1; width: 100%; background: white; }
        iframe { width: 100%; height: 100%; border: none; }
        .footer { background: #1e1e1e; padding: 5px 20px; font-size: 11px; color: #888; border-top: 1px solid #333; text-align: center; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn">← Back</a>
        <input type="text" id="url-input" placeholder="Enter URL or search (e.g., youtube.com)">
        <button class="btn" onclick="launch()">Launch</button>
    </header>

    <div id="iframe-container">
        <iframe id="proxy-frame" src="about:blank"></iframe>
    </div>

    <div class="footer">
        Status: <span id="status" style="color: #00ff00;">Ready</span> | Backend: Cloudflare Worker
    </div>

    <script>
        // REPLACE with your actual Worker URL
        const WORKER_URL = "https://chicken-proxy.chickenmonkey278.workers.dev"; 

        function launch() {
            let val = document.getElementById('url-input').value.trim();
            if (!val) return;

            document.getElementById('status').innerText = "Loading...";
            
            let target;
            if (!val.includes('.') || val.includes(' ')) {
                target = 'https://www.google.com/search?q=' + encodeURIComponent(val);
            } else {
                target = val.startsWith('http') ? val : 'https://' + val;
            }

            // Encapsulate the URL for the Worker
            const finalUrl = `${WORKER_URL}/?url=${encodeURIComponent(target)}`;
            document.getElementById('proxy-frame').src = finalUrl;

            document.getElementById('proxy-frame').onload = () => {
                document.getElementById('status').innerText = "Connected";
            };
        }

        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launch();
        });
    </script>
</body>
</html>

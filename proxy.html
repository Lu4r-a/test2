<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Proxy | Ultra</title>
    <style>
        body { margin: 0; background: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 12px 20px; background: #1e1e1e; display: flex; gap: 12px; align-items: center; border-bottom: 2px solid #ffcc00; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; outline: none; }
        .btn { background: #ffcc00; color: black; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #iframe-container { flex: 1; width: 100%; background: white; }
        iframe { width: 100%; height: 100%; border: none; }
        .notice { background: #000; font-size: 11px; padding: 6px; text-align: center; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <button class="btn" onclick="location.href='index.html'">Back</button>
        <input type="text" id="url-input" placeholder="Search anything (YouTube, Google, Discord)...">
        <button class="btn" onclick="launch()">Launch</button>
    </header>

    <div id="iframe-container">
        <iframe id="proxy-frame" src="about:blank"></iframe>
    </div>

    <div class="notice">
        Running on <b>Ultraviolet Engine</b>. YouTube and Search should now work.
    </div>

    <script>
        /**
         * We are using a public Ultraviolet "portal." 
         * This is what EDURocks and other proxy sites use.
         */
        const PROXY_SERVER = "https://t-8-o.glitch.me/main/";

        function launch() {
            let val = document.getElementById('url-input').value.trim();
            if (!val) return;

            let target;
            if (!val.includes('.') || val.includes(' ')) {
                target = 'https://www.google.com/search?q=' + encodeURIComponent(val);
            } else {
                target = val.startsWith('http') ? val : 'https://' + val;
            }

            const frame = document.getElementById('proxy-frame');
            
            // Professional Encoding (XOR/Base64) used by Ultraviolet
            const encoded = btoa(target);
            frame.src = PROXY_SERVER + encoded;
        }

        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launch();
        });
    </script>
</body>
</html>

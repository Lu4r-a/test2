<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Proxy</title>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        header { 
            padding: 15px 25px; 
            background: #1e1e1e; 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            border-bottom: 2px solid #ffcc00; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #333; 
            color: white; 
            font-size: 16px; 
            outline: none; 
            transition: 0.2s;
        }
        input:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }
        .btn { 
            background: #ffcc00; 
            color: black; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            transition: 0.2s;
        }
        .btn:hover { 
            background: #e6b800; 
            transform: translateY(-1px);
        }
        
        #iframe-container {
            flex: 1;
            width: 100%;
            background: #fff;
            position: relative;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        .status-bar {
            background: #1e1e1e;
            padding: 5px 20px;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn">← Back</a>
        <input type="text" id="url-input" placeholder="Enter URL or search anything...">
        <button class="btn" onclick="launch()">Launch</button>
    </header>

    <div id="iframe-container">
        <iframe id="proxy-frame" src="about:blank"></iframe>
    </div>

    <div class="status-bar">
        <span>Backend: <strong id="connection-status" style="color: #ff4d4d;">Disconnected</strong></span>
        <span>Powered by Private Cloudflare Worker</span>
    </div>

    <script>
        /**
         * 1. PASTE YOUR CLOUDFLARE WORKER URL BELOW
         * It should look like: https://chicken-proxy.yourname.workers.dev/
         */
        const WORKER_URL = "chicken-proxy.chickenmonkey278.workers.dev"; 

        function launch() {
            let input = document.getElementById('url-input').value.trim();
            if (!input) return;

            // Update UI status
            const status = document.getElementById('connection-status');
            status.innerText = "Connecting...";
            status.style.color = "#ffcc00";

            let targetUrl = input;

            // Handle Search vs URL logic
            if (!targetUrl.includes('.') || targetUrl.includes(' ')) {
                targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(targetUrl);
            } else {
                if (!targetUrl.startsWith('http')) {
                    targetUrl = 'https://' + targetUrl;
                }
            }

            const frame = document.getElementById('proxy-frame');

            /**
             * We use a URL parameter (?url=) to tell your Worker 
             * exactly which site to fetch and return to you.
             */
            const finalRequestUrl = WORKER_URL + "?url=" + encodeURIComponent(targetUrl);
            
            frame.src = finalRequestUrl;

            frame.onload = () => {
                status.innerText = "Connected";
                status.style.color = "#00ff00";
            };
        }

        // Allow "Enter" key to trigger the search
        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launch();
        });
    </script>
</body>
</html>
